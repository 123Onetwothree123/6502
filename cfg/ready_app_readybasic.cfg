# Linker configuration for ReadyBASIC.
# The PRG is compact on disk: it loads at $1000, then the entry code copies
# the bridge to $C000 and hidden helpers to RAM under BASIC ROM at $A000.

MEMORY {
    LOADADDR: file = %O, start = $0FFE, size = $0002;
    APP:      file = %O, start = $1000, size = $3000, type = ro, define = yes;
    HIDDEN:   file = "", start = $A000, size = $2000, type = ro;
    BRIDGE:   file = "", start = $C000, size = $0600, type = rw;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    ENTRY:    load = APP,     type = ro;
    HIDDEN:   load = APP,     run = HIDDEN, type = ro, define = yes;
    BRIDGE:   load = APP,     run = BRIDGE, type = rw, define = yes;
}
