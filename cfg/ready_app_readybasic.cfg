# Linker configuration for ReadyBASIC.
# The PRG loads at $1000.  The tiny entry remains there, the visible resident
# core lives at $1200-$1BFF, low overlays run at $1C00-$23FF, shared buffers
# live at $2400-$27FF, and the packed command seed image lives at $2800-$2FFF.
# BASIC starts at $3001.  Hidden helpers and the bridge are copied out of the
# load image before BASIC owns the $3001+ workspace.

MEMORY {
    LOADADDR: file = %O, start = $0FFE, size = $0002;
    ENTRY:    file = %O, start = $1000, size = $0200, type = ro, define = yes, fill = yes;
    RESIDENT: file = %O, start = $1200, size = $0A00, type = ro, fill = yes;
    PADLOW:   file = %O, start = $1C00, size = $0C00, type = ro, fill = yes;
    LOWOVL:   file = "", start = $1C00, size = $0800, type = rw, define = yes;
    SHARED:   file = "", start = $2400, size = $0400, type = rw, define = yes;
    CMDPACK:  file = %O, start = $2800, size = $0800, type = ro, define = yes, fill = yes;
    HIDLOAD:  file = %O, start = $3000, size = $0800, type = ro, define = yes, fill = yes;
    BRLOAD:   file = %O, start = $3800, size = $0800, type = ro, define = yes, fill = yes;
    REGSEED:  file = %O, start = $4000, size = $0200, type = ro, define = yes, fill = yes;
    HIDDEN:   file = "", start = $A000, size = $0600, type = ro;
    HIDDENOVL:file = "", start = $A800, size = $1800, type = ro;
    BRIDGE:   file = "", start = $C000, size = $0600, type = rw;
}

SEGMENTS {
    LOADADDR:  load = LOADADDR, type = ro;
    ENTRY:     load = ENTRY,    type = ro;
    RESIDENT:  load = RESIDENT, type = ro, define = yes;
    PADLOW:    load = PADLOW,   type = ro;
    LOWPACK:   load = CMDPACK,  run = LOWOVL, type = ro, define = yes;
    HIDDENPACK:load = CMDPACK,  run = HIDDENOVL, type = ro, define = yes;
    HIDDEN:    load = HIDLOAD,  run = HIDDEN, type = ro, define = yes;
    BRIDGE:    load = BRLOAD,   run = BRIDGE, type = rw, define = yes;
    REGSEED:   load = REGSEED,  type = ro;
}
