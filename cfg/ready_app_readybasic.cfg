# Linker configuration for ReadyBASIC.
# The PRG loads at $1000.  The tiny entry remains there, the visible resident
# core lives at $1200-$2ABF, low overlays run under BASIC ROM at $A900+,
# shared buffers live at $C200-$C5FF, and the packed command seed image lives
# in cold-load regions beginning at $2B00. BASIC owns $2AC1-$9FFF. Hidden
# helpers, shared buffers, and the bridge stay outside that BASIC workspace.

MEMORY {
    LOADADDR: file = %O, start = $0FFE, size = $0002;
    ENTRY:    file = %O, start = $1000, size = $0200, type = ro, define = yes, fill = yes;
    RESIDENT: file = %O, start = $1200, size = $18C0, type = ro, fill = yes;
    PADLOW:   file = %O, start = $2AC0, size = $0040, type = ro, fill = yes;
    LOWOVL:   file = "", start = $A900, size = $1700, type = rw, define = yes;
    SHARED:   file = "", start = $C200, size = $0400, type = rw, define = yes;
    CMDPACK:  file = %O, start = $2B00, size = $1500, type = ro, define = yes, fill = yes;
    HIDLOAD:  file = %O, start = $4000, size = $0800, type = ro, define = yes, fill = yes;
    BRLOAD:   file = %O, start = $4800, size = $0800, type = ro, define = yes, fill = yes;
    REGSEED:  file = %O, start = $5000, size = $1200, type = ro, define = yes, fill = yes;
    HIDDEN:   file = "", start = $A000, size = $0600, type = ro;
    HIDDENOVL:file = "", start = $A800, size = $0100, type = ro;
    BRIDGE:   file = "", start = $C000, size = $0600, type = rw;
}

SEGMENTS {
    LOADADDR:  load = LOADADDR, type = ro;
    ENTRY:     load = ENTRY,    type = ro;
    RESIDENT:  load = RESIDENT, type = ro, define = yes;
    PADLOW:    load = PADLOW,   type = ro;
    LOWPACK:   load = CMDPACK,  run = LOWOVL, type = ro, define = yes;
    HIDDENPACK:load = CMDPACK,  run = HIDDENOVL, type = ro, define = yes;
    HIDDEN:    load = HIDLOAD,  run = HIDDEN, type = ro, define = yes;
    BRIDGE:    load = BRLOAD,   run = BRIDGE, type = rw, define = yes;
    REGSEED:   load = REGSEED,  type = ro;
}
