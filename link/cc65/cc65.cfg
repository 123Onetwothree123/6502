# ld65 链接器配置 —— 6502 模拟器（64KiB 纯 RAM + $F001 UART + $FFFC 复位向量）
#
# 用法：
#   ca65 link/cc65/crt0.s -o crt0.o
#   cl65 -t none -C link/cc65/cc65.cfg -O -o out.bin main.c crt0.o
#   ./build/6502 out.bin
#
# 布局说明：
#   ld65 按 MEMORY 区顺序把数据顺序写入输出文件，文件偏移 = 已写字节数，
#   所以要让"文件偏移 = 内存地址"，整个 64KiB 必须是单个连续区域 + fill=yes。
#   这样产出的 .bin 是完整的 64KiB 镜像，ProgramLoader 以 base=0 直接加载。
#   （$F001 是 UART 寄存器，镜像里该字节会被模拟器跳过；$0100-$01FF 为硬件栈区）

SYMBOLS {
    # 硬件栈在 $0100-$01FF，不在 RAM 里分配软栈
    __STACKSIZE__: type = weak, value = $0000;
}

MEMORY {
    RAM: file = %O, fill = yes, define = yes, start = $0000, size = $10000;
}

SEGMENTS {
    ZEROPAGE: load = RAM, start = $0000, type = zp;
    STARTUP:  load = RAM, start = $0200, type = ro;
    LOWCODE:  load = RAM, type = ro, optional = yes;
    ONCE:     load = RAM, type = ro, optional = yes;
    CODE:     load = RAM, type = ro;
    RODATA:   load = RAM, type = ro;
    DATA:     load = RAM, type = rw;
    BSS:      load = RAM, type = bss, define = yes;
    VECTORS:  load = RAM, start = $FFFA, type = rw;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
